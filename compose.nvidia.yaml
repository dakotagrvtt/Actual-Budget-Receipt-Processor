# NVIDIA GPUs: run every llama.cpp service on the CUDA build instead of Vulkan.
#   docker compose -f compose.yaml -f compose.nvidia.yaml up -d
# (or put COMPOSE_FILE=compose.yaml:compose.nvidia.yaml in .env so ./receipts and plain `docker compose` use it).
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the host (`nvidia-smi` works inside
# `docker run --rm --gpus all ubuntu nvidia-smi`). Model flags and files are the same as on Vulkan; VRAM use should be
# about the same. ./receipts setup adds this file when it finds nvidia-smi.
# Untested by the author (developed on an AMD card); please open an issue with what you find.
x-cuda: &cuda
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  devices: !reset []
  group_add: !reset []
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llm: *cuda
  decider-gguf: *cuda
